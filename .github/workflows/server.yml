name: server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
      - 'codecov.yml'
      - 'Makefile'
      - '.golangci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
      - 'codecov.yml'
      - 'Makefile'
      - '.golangci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/management/go.mod
          cache-dependency-path: server/management/go.sum

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Swagger up to date
        working-directory: server/management
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init && git diff --exit-code -- docs/

      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/management/go.mod
          cache-dependency-path: server/management/go.sum

      - name: Lint
        run: make lint
