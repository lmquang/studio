name: Web UI
on:
  push:
    paths: ['webui/**', '.github/workflows/webui.yml']
  pull_request:
    paths: ['webui/**', '.github/workflows/webui.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui
